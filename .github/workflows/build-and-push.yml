name: CI — build and push images

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            image_basename: frontend
          - service: issuance
            context: backend/issuance
            dockerfile: backend/issuance/Dockerfile
            image_basename: issuance
          - service: verification
            context: backend/verification
            dockerfile: backend/verification/Dockerfile
            image_basename: verification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'



      - name: Run tests
        working-directory: ${{ matrix.context }}
        run: |
          npm ci
          npm test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_basename }}:${{ github.sha }}

      - name: Update k8s manifests (output image tag mapping)
        if: always()
        run: |
          echo "Built ${{ matrix.service }} -> ghcr.io/${{ github.repository_owner }}/${{ matrix.image_basename }}:${{ github.sha }}"
