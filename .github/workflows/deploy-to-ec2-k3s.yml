name: CD — deploy to EC2 (k3s)

on:
  workflow_dispatch:
    inputs:
      instance_type:
        description: 'EC2 instance type'
        required: false
        default: 't3.micro'
      allocate_eip:
        description: 'Allocate Elastic IP (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "Writing SSH key"
          echo "$SSH_PRIVATE_KEY" > id_rsa
          chmod 600 id_rsa

      - name: Launch EC2 instance with cloud-init (k3s)
        id: launch
        env:
          KEY_PAIR_NAME: ${{ secrets.KEY_PAIR_NAME }}
        run: |
          # Pick instance type from workflow input or use default
          INSTANCE_TYPE="${{ github.event.inputs.instance_type }}"
          INSTANCE_TYPE=${INSTANCE_TYPE:-t3.micro}
          KEY_NAME="$KEY_PAIR_NAME"
          IMAGE_ID=$(aws ec2 describe-images --owners 099720109477 --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-focal-20.04-amd64-server-*" --query 'Images | sort_by(@, &CreationDate)[-1].ImageId' --output text)
          # copy the bundled user-data template into a file and use it
          cp .github/workflows/k3s-user-data.txt user-data.txt

          echo "Launching instance..."
          INSTANCE_ID=$(aws ec2 run-instances --image-id $IMAGE_ID --count 1 --instance-type $INSTANCE_TYPE --key-name $KEY_NAME --user-data file://user-data.txt --query 'Instances[0].InstanceId' --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Wait for instance to be running and retrieve IP
        id: ip
        run: |
          INSTANCE_ID=${{ steps.launch.outputs.instance_id }}
          aws ec2 wait instance-running --instance-ids $INSTANCE_ID
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

      - name: Wait for SSH and copy kubeconfig
        run: |
          IP=${{ steps.ip.outputs.public_ip }}
          echo "Waiting for SSH on $IP"
          for i in {1..30}; do
            ssh -o StrictHostKeyChecking=no -i id_rsa ubuntu@$IP 'echo ok' && break || sleep 5
          done
          scp -o StrictHostKeyChecking=no -i id_rsa ubuntu@$IP:/home/ubuntu/.kube/config ./kubeconfig || true
          # If k3s kubeconfig binds to 127.0.0.1, rewrite server endpoint to public IP
          if grep -q '127.0.0.1' kubeconfig 2>/dev/null; then
            sed -i "s/127.0.0.1/${{ steps.ip.outputs.public_ip }}/g" kubeconfig || true
          fi
          export KUBECONFIG=$PWD/kubeconfig
          kubectl get nodes || true

      - name: Create namespace and imagePullSecret, apply manifests
        env:
          GHCR_PAT: ${{ secrets.GITHUB_PAT_FOR_GHCR }}
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl create namespace kube-credential --dry-run=client -o yaml | kubectl apply -f -
          kubectl delete secret regcred -n kube-credential --ignore-not-found
          kubectl create secret docker-registry regcred \
            --docker-server=ghcr.io \
            --docker-username=${{ github.repository_owner }} \
            --docker-password=$GHCR_PAT \
            -n kube-credential
          # Apply DBs and services
          kubectl apply -f k8s/postgres-issuance.yaml
          kubectl apply -f k8s/postgres-verification.yaml
          kubectl apply -f k8s/issuance-deployment.yaml
          kubectl apply -f k8s/verification-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl -n kube-credential rollout status deploy/issuance --timeout=120s || true
          kubectl -n kube-credential rollout status deploy/verification --timeout=120s || true
          kubectl -n kube-credential rollout status deploy/frontend --timeout=120s || true

      - name: Output cluster info
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl get pods,svc -n kube-credential -o wide

      - name: Tear-down note
        run: |
          echo "To tear down this cluster, run: aws ec2 terminate-instances --instance-ids ${{ steps.launch.outputs.instance_id }} --region $AWS_REGION"
