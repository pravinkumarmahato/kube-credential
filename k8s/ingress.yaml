apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-credential-ingress
  namespace: kube-credential
  annotations:
    kubernetes.io/ingress.class: "nginx"

    # Let’s Encrypt certificate automation via cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-production"

    # Ensure proper path rewriting and HTTPS redirection
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1

    # Optional: allow large request bodies if your APIs need it
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"

spec:
  ingressClassName: nginx
  rules:
    - host: kube-credentials.pravinkumarmahato.dev
      http:
        paths:
          - path: /api/issue
            pathType: Prefix
            backend:
              service:
                name: issuance
                port:
                  number: 3000

          - path: /api/verify
            pathType: Prefix
            backend:
              service:
                name: verification
                port:
                  number: 3001

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

  tls:
    - hosts:
        - kube-credentials.pravinkumarmahato.dev
      secretName: kube-credential-tls
