apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kube-credential
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          image: ghcr.io/pravinkumarmahato/frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: VITE_ISSUE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: issuance-api-key
                  key: issuance_api_key
            - name: VITE_VERIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: verification-api-key
                  key: verification_api_key
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kube-credential
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 32080
