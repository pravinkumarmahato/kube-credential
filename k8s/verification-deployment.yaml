apiVersion: apps/v1
kind: Deployment
metadata:
  name: verification
  namespace: kube-credential
spec:
  replicas: 2
  selector:
    matchLabels:
      app: verification
  template:
    metadata:
      labels:
        app: verification
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: verification
          image: ghcr.io/pravinkumarmahato/verification:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 3001
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ISSUANCE_SERVICE_URL
              value: "http://issuance:3000"
            - name: POSTGRES_HOST
              value: postgres-verification
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-verification-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-verification-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-verification-secret
                  key: POSTGRES_DB
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: verification-api-key
                  key: verification_api_key
            - name: ISSUANCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: issuance-api-key
                  key: issuance_api_key
            - name: ALLOWED_ORIGINS
              value: "http://issuance:3000,http://verification:3001,http://13.53.97.117:8081"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      # No local file-backed storage required; verification will use Postgres
      # Secrets are provided via env var `API_KEY` from `verification-api-key`
---
apiVersion: v1
kind: Service
metadata:
  name: verification
  namespace: kube-credential
spec:
  selector:
    app: verification
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
